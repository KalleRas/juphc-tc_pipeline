apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: juphc-tc-pipeline-run-
spec:
  pipelineRef:
    name: juphc-tc-pipeline
  params:
    - name: repo-url
      value: https://github.com/KalleRas/zntwk-tax_calculator.git
    - name: branch
      value: main
    - name: build-image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-n2raka00/tax-calculator:latest
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
    - name: dockerconfig-ws
      emptyDir: {}